name: Build and Release Dev

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build WASM Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Install WASI SDK
        run: |
          mkdir -p /tmp/wasi-sdk
          curl -sSL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-x86_64-linux.tar.gz" | tar -xz -C /tmp/wasi-sdk --strip-components=1
          echo "WASI_SDK_PATH=/tmp/wasi-sdk" >> $GITHUB_ENV
          echo "CC_wasm32_wasip2=/tmp/wasi-sdk/bin/clang" >> $GITHUB_ENV

      - name: Build plugin
        run: cargo build --release --target wasm32-wasip2

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pumpkin_duels
          path: target/wasm32-wasip2/release/pumpkin_duels.wasm
          if-no-files-found: error

      - name: Update rolling dev release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete dev --yes --cleanup-tag || true
          gh release create dev target/wasm32-wasip2/release/pumpkin_duels.wasm \
            --target "${{ github.sha }}" \
            --title "Development Build" \
            --notes "Automated development build compiled from commit ${{ github.sha }}. Overwritten on each push to main." \
            --prerelease
